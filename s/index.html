<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Strength Society</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #0A84FF;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
    }
    .btn:hover { background: #0070E0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏋️</div>
    <h1>The Strength Society</h1>
    <p>Someone shared a workout with you. Open it in the app to start training.</p>
    <a class="btn" href="https://apps.apple.com/app/id6743597940">Open in App Store</a>
  </div>
</body>
</html>
