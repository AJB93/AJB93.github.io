<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Strength Society</title>
  <meta property="og:title" content="The Strength Society">
  <meta property="og:description" content="Someone shared a workout with you. Tap to open.">
  <meta property="og:image" content="https://ajb93.github.io/icon.png">
  <meta property="og:url" content="https://ajb93.github.io">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Strength Society">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #0A84FF;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
    }
    .btn:hover { background: #0070E0; }

    /* Dynamic preview styles */
    .preview {
      text-align: left;
      margin-bottom: 32px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .preview-header .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 0;
      flex-shrink: 0;
    }
    .preview-header-text h1 {
      font-size: 22px;
      margin-bottom: 4px;
      text-align: left;
    }
    .preview-meta {
      font-size: 14px;
      color: #8e8e93;
      font-weight: 400;
    }
    .exercise-list {
      list-style: none;
      margin-bottom: 8px;
    }
    .exercise-item {
      padding: 14px 16px;
      background: #1c1c1e;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .exercise-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .exercise-detail {
      font-size: 13px;
      color: #8e8e93;
    }
    .workout-section {
      background: #1c1c1e;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .workout-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .day-badge {
      background: #2c2c2e;
      color: #8e8e93;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      flex-shrink: 0;
      min-width: 40px;
      text-align: center;
    }
    .workout-row-text {
      flex: 1;
      min-width: 0;
    }
    .workout-row-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .workout-row-detail {
      font-size: 13px;
      color: #8e8e93;
    }
    .nested-exercises {
      padding: 0 16px 12px;
    }
    .nested-exercise {
      padding: 8px 12px;
      background: #2c2c2e;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .nested-exercise:last-child {
      margin-bottom: 0;
    }
    .nested-exercise-name {
      font-size: 14px;
      font-weight: 500;
    }
    .nested-exercise-detail {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 2px;
    }
    .cta-area {
      text-align: center;
    }
    .cta-text {
      font-size: 15px;
      color: #8e8e93;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
      vertical-align: -3px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Fallback (shown while loading or if decode fails) -->
    <img class="icon" src="/icon.png" alt="The Strength Society">
    <h1>The Strength Society</h1>
    <p class="subtitle">Someone shared a workout with you. Open it in the app to start training.</p>
    <p class="cta-text">Start training today. Import this workout with The Strength Society app. Currently free on iOS.</p>
    <a class="btn" href="https://testflight.apple.com/join/wxVhh9fy"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-62.6 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>Join the Beta</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        // Expected: ["s", "w"|"p", "{payload}"]
        if (parts.length < 3 || parts[0] !== 's') return;

        var type = parts[1];
        if (type !== 'w' && type !== 'p') return;

        var encoded = parts.slice(2).join('/');

        // base64url → base64
        var base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
        var pad = base64.length % 4;
        if (pad > 0) base64 += '='.repeat(4 - pad);

        // Decode base64 → Uint8Array
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        // Decompress: try zlib first, fall back to raw deflate (Apple NSData)
        var inflated;
        try {
          inflated = pako.inflate(bytes, { to: 'string' });
        } catch (e) {
          inflated = pako.inflateRaw(bytes, { to: 'string' });
        }
        var data = JSON.parse(inflated);

        var card = document.getElementById('card');

        if (type === 'w') {
          renderWorkout(card, data);
        } else {
          renderPlan(card, data);
        }
      } catch (e) {
        // Decode failed — keep fallback card
      }
    })();

    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function formatSets(sets) {
      if (!sets || sets.length === 0) return '';
      var unique = {};
      sets.forEach(function(s) {
        var w = s.weight != null ? s.weight + ' kg' : 'BW';
        var r = s.reps != null ? s.reps : '?';
        var key = w + ' x ' + r;
        unique[key] = (unique[key] || 0) + 1;
      });
      var parts = [];
      Object.keys(unique).forEach(function(key) {
        var count = unique[key];
        parts.push(count > 1 ? count + ' x ' + key : key);
      });
      return parts.join(', ');
    }

    function formatMuscles(groups) {
      if (!groups || groups.length === 0) return '';
      return groups.map(function(g) {
        return g.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      }).join(', ');
    }

    var appleSvg = '<svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-62.6 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';

    function ctaBlock(type) {
      var noun = type === 'p' ? 'plan' : 'workout';
      var html = '<div class="cta-area">';
      html += '<p class="cta-text">Start training today. Import this ' + noun + ' with The Strength Society app. Currently free on iOS.</p>';
      html += '<a class="btn" href="https://testflight.apple.com/join/wxVhh9fy">' + appleSvg + 'Join the Beta</a>';
      html += '</div>';
      return html;
    }

    function dayLabel(day) {
      var map = {
        monday: 'Mon', tuesday: 'Tue', wednesday: 'Wed', thursday: 'Thu',
        friday: 'Fri', saturday: 'Sat', sunday: 'Sun', rest: 'Rest'
      };
      return map[(day || '').toLowerCase()] || day || '?';
    }

    function renderWorkout(card, data) {
      var exercises = data.exercises || [];
      var html = '<div class="preview">';
      html += '<div class="preview-header">';
      html += '<img class="icon" src="/icon.png" alt="The Strength Society">';
      html += '<div class="preview-header-text">';
      html += '<h1>' + esc(data.name || 'Shared Workout') + '</h1>';
      html += '<div class="preview-meta">' + esc(data.category || 'General') + ' &middot; ' + exercises.length + ' exercise' + (exercises.length !== 1 ? 's' : '') + '</div>';
      html += '</div></div>';

      html += '<ul class="exercise-list">';
      exercises.forEach(function(ex) {
        html += '<li class="exercise-item">';
        html += '<div class="exercise-name">' + esc(ex.name) + '</div>';
        var details = [];
        var setsStr = formatSets(ex.sets);
        if (setsStr) details.push(setsStr);
        var musclesStr = formatMuscles(ex.muscleGroups);
        if (musclesStr) details.push(musclesStr);
        if (details.length > 0) {
          html += '<div class="exercise-detail">' + esc(details.join(' — ')) + '</div>';
        }
        html += '</li>';
      });
      html += '</ul></div>';

      html += ctaBlock('w');

      card.innerHTML = html;
    }

    function renderPlan(card, data) {
      var workouts = data.workouts || [];
      var html = '<div class="preview">';
      html += '<div class="preview-header">';
      html += '<img class="icon" src="/icon.png" alt="The Strength Society">';
      html += '<div class="preview-header-text">';
      html += '<h1>' + esc(data.name || 'Shared Plan') + '</h1>';
      var meta = [];
      if (data.targetWorkoutsPerWeek) meta.push(data.targetWorkoutsPerWeek + 'x / week');
      meta.push(workouts.length + ' workout' + (workouts.length !== 1 ? 's' : ''));
      html += '<div class="preview-meta">' + esc(meta.join(' · ')) + '</div>';
      html += '</div></div>';

      workouts.forEach(function(pw) {
        var w = pw.workout || {};
        var exercises = w.exercises || [];
        html += '<div class="workout-section">';
        html += '<div class="workout-row">';
        if (data.scheduleMode === 'dayBased') {
          html += '<div class="day-badge">' + esc(dayLabel(pw.dayOfWeek)) + '</div>';
        }
        html += '<div class="workout-row-text">';
        html += '<div class="workout-row-name">' + esc(w.name || 'Workout') + '</div>';
        html += '<div class="workout-row-detail">' + esc(w.category || 'General') + ' &middot; ' + exercises.length + ' exercise' + (exercises.length !== 1 ? 's' : '') + '</div>';
        html += '</div></div>';

        if (exercises.length > 0) {
          html += '<div class="nested-exercises">';
          exercises.forEach(function(ex) {
            html += '<div class="nested-exercise">';
            html += '<div class="nested-exercise-name">' + esc(ex.name) + '</div>';
            var details = [];
            var setsStr = formatSets(ex.sets);
            if (setsStr) details.push(setsStr);
            var musclesStr = formatMuscles(ex.muscleGroups);
            if (musclesStr) details.push(musclesStr);
            if (details.length > 0) {
              html += '<div class="nested-exercise-detail">' + esc(details.join(' — ')) + '</div>';
            }
            html += '</div>';
          });
          html += '</div>';
        }

        html += '</div>';
      });

      html += '</div>';
      html += ctaBlock('p');

      card.innerHTML = html;
    }
  </script>
</body>
</html>
